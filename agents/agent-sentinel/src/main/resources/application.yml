spring:
  application:
    name: agent-sentinel
  main:
    banner-mode: off
    web-application-type: none
  threads:
    virtual:
      enabled: true
  ai:
    retry:
      # The fabric's own repair loop and step retries handle failures; fail fast here.
      max-attempts: 1
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

fabric:
  nats:
    url: ${NATS_URL:nats://localhost:4222}
  agent:
    provider: agent-sentinel
  sentinel:
    # How often every open goal is assessed again, besides reacting to facts: risk grows as days pass.
    sweep: ${FABRIC_SENTINEL_SWEEP:PT1H}
  model:
    mode: ${FABRIC_MODEL_MODE:live}
    chat: ${FABRIC_CHAT_MODEL:qwen3.5:4b}

logging:
  level:
    root: warn
    dev.capabilityfabric: info
